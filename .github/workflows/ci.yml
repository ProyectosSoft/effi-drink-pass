name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA de commit (un tag movido no puede cambiar el código que corre).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: ninguna dependencia ejecuta scripts de instalación en CI.
      - run: npm ci --ignore-scripts
      - name: Typecheck (app + Edge Functions)
        run: npm run typecheck
      - name: Tests (unit + API end-to-end + PostgreSQL con migraciones reales)
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Buscar secretos accidentales en el bundle
        run: |
          if grep -rEl "sb_secret_[A-Za-z0-9]{8,}|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG" dist/; then
            echo "::error::El bundle contiene referencias a secretos"; exit 1
          fi
