name: Deploy Supabase (migraciones + Edge Function)

# Ejecución MANUAL (Actions → Deploy Supabase → Run workflow) para controlar cuándo cambia la base de datos.
# Secrets (Settings → Secrets and variables → Actions → Secrets, o del environment "production"):
#   SUPABASE_ACCESS_TOKEN   token personal de Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    ref del proyecto (xxxxxxxxxxxxxxxxxxxx)
#   SUPABASE_DB_PASSWORD    contraseña de la base de datos
#   API_JWT_SECRET          secreto HS256 de la API (>= 32 caracteres aleatorios)
#   WEBHOOK_DISPATCHER_SECRET  secreto del despachador de webhooks (>= 32 caracteres)
# Variable: API_ALLOWED_ORIGINS (orígenes CORS de la API, coma-separados; opcional)
#
# Seguridad: este job maneja credenciales de producción, por eso
#  - las actions se fijan por SHA de commit (un tag movido no puede inyectar código) y la CLI a una versión exacta;
#  - los secretos se pasan por `env:` y nunca se interpolan con ${{ }} dentro de `run:` (evita inyección de shell);
#  - se recomienda configurar el environment "production" con revisores obligatorios.

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: Aplicar migraciones pendientes (supabase db push)
        type: boolean
        default: true
      deploy_function:
        description: Desplegar las Edge Functions "api" y "webhooks"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - name: Vincular proyecto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migraciones
        if: ${{ inputs.push_migrations }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Secrets de la Edge Function
        if: ${{ inputs.deploy_function }}
        env:
          API_JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          API_ALLOWED_ORIGINS: ${{ vars.API_ALLOWED_ORIGINS }}
          WEBHOOK_DISPATCHER_SECRET: ${{ secrets.WEBHOOK_DISPATCHER_SECRET }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            "API_JWT_SECRET=$API_JWT_SECRET" \
            "API_ALLOWED_ORIGINS=$API_ALLOWED_ORIGINS" \
            "WEBHOOK_DISPATCHER_SECRET=$WEBHOOK_DISPATCHER_SECRET"
      - name: Edge Functions
        if: ${{ inputs.deploy_function }}
        run: |
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy webhooks --project-ref "$PROJECT_REF" --no-verify-jwt
