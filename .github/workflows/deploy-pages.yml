name: Deploy frontend to GitHub Pages

# Requisitos (una vez): Settings → Pages → Source: GitHub Actions.
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (públicas por diseño; protegidas por RLS)
#   VITE_PUBLIC_APP_URL  (opcional; p. ej. https://drinkpass.midominio.com o https://<user>.github.io/<repo>)
#   PAGES_BASE_PATH      (opcional; "/" con dominio propio. Por defecto "/<repo>/")
#
# Seguridad: actions fijadas por SHA; el build (que ejecuta dependencias de npm) solo tiene
# permiso de lectura; los permisos de Pages/OIDC se conceden únicamente al job "deploy".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: ninguna dependencia ejecuta scripts de instalación en CI.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - name: Verificar que no hay secretos en el bundle
        run: |
          if grep -rEl "sb_secret_[A-Za-z0-9]{8,}|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG" dist/; then echo "::error::secreto en el bundle"; exit 1; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
